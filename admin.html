<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#eef4f7"><script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<title>FCS Attendance - Admin</title><style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap');

*{box-sizing:border-box}body{margin:0;background:#eef4f7;color:#183047;font:14px Arial,Helvetica,sans-serif}.app{max-width:1280px;margin:auto;padding:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}h1{font-size:22px;margin:0 0 3px}h2{font-size:18px;margin:0 0 8px}h3{font-size:15px;margin:0 0 10px}.muted{color:#64748b}
.card{background:#fff;border:1px solid #d5e0e8;border-radius:10px;padding:14px;margin-bottom:12px;box-shadow:0 2px 7px rgba(23,50,77,.04)}
button,a{font:inherit}.btn{border:1px solid #c7d5df;background:#e4eef2;color:#183047;padding:8px 11px;border-radius:6px;cursor:pointer}.primary{background:#245c73;color:#fff;border-color:#245c73}
.savebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.savebar .primary{padding:10px 15px}.saveState{color:#526879}.tabs,.modes{display:flex;gap:0;border-bottom:1px solid #c7d5df;margin-bottom:10px}.tabs button,.modes button{border-radius:6px 6px 0 0;border:1px solid #c7d5df;border-bottom:0;margin-right:3px}.active{background:#fff!important;font-weight:700}
.toolbar{display:flex;align-items:flex-start;gap:7px;flex-wrap:wrap;background:#f7fafc;border:1px solid #d5e0e8;padding:8px;margin-bottom:0}.toolbar input,.toolbar select{padding:8px;border:1px solid #c7d5df;border-radius:6px}
.personTabs{display:flex;flex-direction:column;gap:4px;width:180px;padding:2px;flex:none}.personTab{white-space:nowrap;text-align:left;width:100%}.registerLayout{display:grid;grid-template-columns:190px minmax(0,1fr);gap:10px}.registerMain{min-width:0}
.tablewrap{overflow:auto;background:#fff;border:1px solid #d5e0e8}table{border-collapse:collapse;width:100%;min-width:800px}th,td{border-right:1px solid #d9e2e8;border-bottom:1px solid #d9e2e8;padding:6px 7px;white-space:nowrap;text-align:center}th{background:#e2edf2}td:first-child,th:first-child{text-align:left}
td input,td select{width:100%;min-width:72px;border:1px solid transparent;background:transparent;padding:5px;text-align:center}td input:focus,td select:focus{border-color:#76a9bb;background:#fff;outline:none}
.summary{font-weight:700;background:#fff;padding:8px;border-left:1px solid #d5e0e8;border-right:1px solid #d5e0e8}.total td{font-weight:700;background:#e8f0f3}.presentRow td{background:#eef9f3}.leaveRow td{background:#fff7df}.absentRow td{background:#fdeeee}.sundayRow td{background:#edf0f2}.holidayRow td{background:#e8f3fa}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.grid input,.grid select{padding:9px;border:1px solid #c7d5df;border-radius:6px}
.regCards{display:none}.regCard{border:1px solid #d5e0e8;border-radius:8px;margin:8px 0;background:#fff;padding:10px}.regCardHead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}.regCardHead select{width:auto;min-width:130px;padding:6px}.regFields{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.regFields label{font-size:11px;font-weight:700;color:#526879}.regFields input{display:block;width:100%;min-width:0;margin-top:3px;border:1px solid #c7d5df;background:#fff;border-radius:5px;padding:8px;text-align:center}
.regCard.sundayRow{background:#edf0f2}.regCard.holidayRow{background:#e8f3fa}.regCard.leaveRow{background:#fff7df}.regCard.absentRow{background:#fdeeee}.regCard.presentRow{background:#eef9f3}.hidden{display:none!important}.message{min-height:20px}.error{color:#b42318}.ok{color:#19704a}
.login{max-width:430px;margin:70px auto}.loginBrand{display:flex;align-items:center;gap:12px;margin-bottom:14px}.loginBrand h1{margin:0 0 2px;font-size:22px}.loginBrand p{margin:0;color:#64748b}.brandMark{width:48px;height:48px;border-radius:9px;background:#245c73;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}.loginLine{height:1px;background:#d5e0e8;margin:0 0 16px}.login input{width:100%;padding:11px;border:1px solid #c7d5df;border-radius:6px;margin-top:5px}.login button{width:100%;margin-top:12px}.readme{line-height:1.5}.readme li{margin:5px 0}.readme h2{margin-top:0}.readme h3{margin:16px 0 6px;color:#245c73}.readme ul{margin:6px 0 10px;padding-left:22px}.readme .ruleNote{background:#f7fafc;border:1px solid #d5e0e8;border-radius:7px;padding:9px 11px;margin:8px 0}
@media(max-width:700px){.app{padding:9px}.grid{grid-template-columns:1fr}.top{align-items:flex-start}.toolbar{flex-wrap:wrap}.registerLayout{grid-template-columns:1fr}.personTabs{order:0;width:100%;max-height:180px;overflow:auto}.registerTableWrap{display:none}.regCards{display:block}.regFields{grid-template-columns:repeat(2,1fr)}.regCardHead select{font-size:12px}}
@media print{
 @page{size:A4 portrait;margin:8mm}
 html,body{background:#fff!important;color:#111!important;width:100%;margin:0;padding:0}
 .app{max-width:none!important;width:100%!important;padding:0!important;margin:0!important}
 .top,.savebar,.tabs,.modes,.toolbar,.personTabs,.noPrint,.regCards{display:none!important}
 .card,.tablewrap,.regCard{background:#fff!important;box-shadow:none!important;border:0!important;color:#111!important}
 .registerLayout{display:block!important}
 .registerMain{width:100%!important}
 .summary{background:#fff!important;color:#111!important;border:0!important;padding:4px!important;text-align:center;font-size:10px}
 .tablewrap{display:block!important;overflow:visible!important;width:100%!important}
 table{display:table!important;width:100%!important;min-width:0!important;table-layout:fixed!important;border-collapse:collapse!important;font-size:9px!important}
 th,td{padding:4px 3px!important;border:1px solid #777!important;white-space:normal!important;overflow:visible!important;color:#111!important;background:#fff!important}
 th:first-child,td:first-child{width:24%!important;text-align:left!important}
 th:not(:first-child),td:not(:first-child){width:12.67%!important;text-align:center!important}
 td input,td select{border:0!important;background:transparent!important;padding:0!important;color:#111!important;font-size:9px!important}
 .presentRow td{background:#eef9f3!important}.leaveRow td{background:#fff7df!important}.absentRow td{background:#fdeeee!important}.sundayRow td{background:#edf0f2!important}.holidayRow td{background:#e8f3fa!important}
}
</style></head>
<body><main id="root"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./admin.js?v=20261007-2"></script>
</body></html>
