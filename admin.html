/* Night Shift: one design language across login, register, reports and settings. */
:root{color-scheme:dark;--night:#080d1c;--panel:#151d37;--panel-2:#10172b;--line:#42506f;--text:#eef3ff;--soft:#aab9d2;--glow:#9672ff;--cyan:#77d9df}

.app{max-width:1360px;padding:clamp(13px,2.2vw,29px)}.top{padding:11px 1px 18px;align-items:center}.top h1{font:700 clamp(27px,3vw,34px)/1.1 'Space Grotesk',sans-serif;letter-spacing:-.055em;color:#fff}.muted{color:#93a6c6;margin-top:6px;font-size:12px}
