.personTabs{width:195px;gap:6px}.registerLayout{grid-template-columns:205px minmax(0,1fr)}.personTab{text-align:left;white-space:normal}.registerMain{min-width:0}.regCard{padding:14px;margin:10px 0}.regCardHead{margin-bottom:11px}.regFields{gap:10px}.regFields label{color:#42606d;font-size:11px;letter-spacing:.025em}.regCard [data-delete]{margin-top:12px}.regCardHead select{border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
