<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eef4f7"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css?v=20261001-light-1"><title>FCS Attendance</title></head>
<body><main class="app">
<header class="topbar"><div><h1>FCS Attendance</h1><p>Daily register entry</p></div><a class="ghost" href="./admin.html">Admin</a></header>
<section class="card gate-card">
<div class="syncbar"><span id="syncStatus">Ready</span></div>
<label>Date</label><div class="dateRow"><input id="workDateDisplay" type="text" inputmode="numeric" maxlength="10" placeholder="dd/mm/yyyy" autocomplete="off" aria-label="Date in dd/mm/yyyy"><button id="datePickerBtn" type="button" class="dateBtn" aria-label="Choose date">Calendar</button><input id="workDate" type="date" class="datePickerHidden" tabindex="-1" aria-hidden="true"></div>
<label>Employee</label><select id="employee"></select>
<div class="timegrid"><div><label>IN</label><input id="inTime" type="text" inputmode="numeric" maxlength="7" placeholder="9:00" autocomplete="off"></div><div><label>OUT</label><input id="outTime" type="text" inputmode="numeric" maxlength="7" placeholder="5:45" autocomplete="off"></div></div><div id="secondShift" class="timegrid hidden"><div><label>IN 2</label><input id="inTime2" type="text" inputmode="numeric" maxlength="7" placeholder="6:00" autocomplete="off"></div><div><label>OUT 2</label><input id="outTime2" type="text" inputmode="numeric" maxlength="7" placeholder="8:00" autocomplete="off"></div></div>
<button id="saveBtn" class="primary">Save</button><p id="message" class="message"></p>
</section>
<p class="smallnote">Enter timings from the physical register. Previous entries are not displayed here.</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js?v=20261007-2"></script>
</body></html>
